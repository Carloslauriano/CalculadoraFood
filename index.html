<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Food</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="app-header">
    <div class="app-header-inner">
      <div class="app-header-text">
        <h1>Calculadora de Taxas (Food Delivery App)</h1>
        <p class="subtitle">Compare as taxas dos marketplaces e descubra o preço de venda recomendado.</p>
      </div>
      <div class="app-header-actions">
        <a href="https://github.com/Carloslauriano/CalculadoraFood" target="_blank" rel="noopener" class="header-github-link" title="Ver no GitHub">
          <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
              0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
              -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
              .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
              -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0
              1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
              1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
              1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
          </svg>
        </a>
        <button type="button" id="clear-btn" class="btn btn-clear">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 4h11M6 4V2.5h4V4M3.5 4l.6 9a1 1 0 001 .9h5.8a1 1 0 001-.9l.6-9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Limpar calculadora
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="controls">
      <div class="controls-row">
        <div class="control-card">
          <label class="control-label" for="profit-margin">Margem de lucro desejada (%)</label>
          <input type="number" id="profit-margin" min="0" step="0.1" value="33">
        </div>
        <div class="control-card">
          <label class="control-label" for="average-orders">Média de pedidos por mês</label>
          <input type="number" id="average-orders" min="0" step="1" value="100">
          <input type="range" id="average-orders-slider" min="100" max="2000" step="50" value="100">
          <p class="hint">O slider vai de 100 a 2000, mas qualquer valor digitado no campo acima é usado no cálculo, mesmo fora dessa faixa.</p>
        </div>
      </div>
      <p id="max-fee-hint" class="hint"></p>
    </section>

    <section class="channels-panel">
      <div class="channels-panel-header">
        <h2>Canais</h2>
        <div class="add-channel-wrapper">
          <button type="button" id="add-channel-btn" class="btn btn-secondary">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>
            Adicionar canal
          </button>
          <div id="channel-picker" class="channel-picker" hidden></div>
        </div>
      </div>
      <div id="channels-list" class="channels-list"></div>
    </section>

    <section class="products-panel">
      <div class="products-panel-header">
        <h2>Produtos</h2>
        <div class="export-actions">
          <button type="button" id="export-csv-btn" class="btn btn-secondary">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 1.5v8.5M4.5 6.5L8 10l3.5-3.5M2.5 12v1.5a1 1 0 001 1h9a1 1 0 001-1V12" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Exportar para CSV
          </button>
          <button type="button" id="export-xlsx-btn" class="btn btn-secondary">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 1.5v8.5M4.5 6.5L8 10l3.5-3.5M2.5 12v1.5a1 1 0 001 1h9a1 1 0 001-1V12" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Exportar para Excel
          </button>
        </div>
      </div>
      <div class="table-scroll">
        <table id="products-table">
          <thead>
            <tr id="table-header-row"></tr>
          </thead>
          <tbody id="products-body"></tbody>
        </table>
      </div>
      <button type="button" id="add-product-btn" class="btn btn-primary">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke-linecap="round"/></svg>
        Adicionar produto
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
