<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Food</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="app-header">
    <div class="app-header-text">
      <h1>Calculadora de Taxas — Food Delivery</h1>
      <p class="subtitle">Compare as taxas dos marketplaces e descubra o preço de venda recomendado.</p>
    </div>
    <div class="app-header-actions">
      <a href="https://github.com/Carloslauriano/CalculadoraFood" target="_blank" rel="noopener" class="header-github-link" title="Ver no GitHub">GitHub</a>
      <button type="button" id="clear-btn" class="btn btn-clear">Limpar calculadora</button>
    </div>
  </header>

  <main>
    <section class="controls">
      <div class="controls-row">
        <div class="control-card">
          <label class="control-label" for="profit-margin">Margem de lucro desejada (%)</label>
          <input type="number" id="profit-margin" min="0" step="0.1" value="33">
        </div>
        <div class="control-card">
          <label class="control-label" for="average-orders">Média de pedidos por mês</label>
          <input type="number" id="average-orders" min="0" step="1" value="100">
          <input type="range" id="average-orders-slider" min="100" max="2000" step="50" value="100">
          <p class="hint">O slider vai de 100 a 2000, mas qualquer valor digitado no campo acima é usado no cálculo, mesmo fora dessa faixa.</p>
        </div>
      </div>
      <p id="max-fee-hint" class="hint"></p>
    </section>

    <section class="channels-panel">
      <div class="channels-panel-header">
        <h2>Canais</h2>
        <div class="add-channel-wrapper">
          <button type="button" id="add-channel-btn" class="btn btn-secondary">+ Adicionar canal</button>
          <div id="channel-picker" class="channel-picker" hidden></div>
        </div>
      </div>
      <div id="channels-list" class="channels-list"></div>
    </section>

    <section class="products-panel">
      <div class="products-panel-header">
        <h2>Produtos</h2>
        <div class="export-actions">
          <button type="button" id="export-csv-btn" class="btn btn-secondary">Exportar para CSV</button>
          <button type="button" id="export-xlsx-btn" class="btn btn-secondary">Exportar para Excel</button>
        </div>
      </div>
      <div class="table-scroll">
        <table id="products-table">
          <thead>
            <tr id="table-header-row"></tr>
          </thead>
          <tbody id="products-body"></tbody>
        </table>
      </div>
      <button type="button" id="add-product-btn" class="btn btn-primary">+ Adicionar produto</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
